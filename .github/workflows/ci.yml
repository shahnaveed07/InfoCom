name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infocom_ams_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infocom_ams_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/infocom_ams_test
      SESSION_SECRET: ci-test-session-secret-minimum-32-chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Deploy PostgreSQL migrations
        run: npm run db:migrate:deploy

      - name: Seed reference records
        run: npm run db:seed

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit & integration test suite
        run: npm test

      - name: Build production client and server bundles
        run: npm run build && npm run build:server

      - name: Generate Cloudflare Worker types & dry-run bundle
        run: npm run cf:types && npm run cf:build

      - name: Apply local D1 migrations & run Cloudflare Worker D1 suite
        run: npm run cf:d1:migrate:local && npm run test:cloudflare

      - name: Verify built SPA assets
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/_headers
          ! grep -rnE '"/src/|/src/assets/' dist/index.html dist/assets/*.js

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser E2E suite
        run: npm run test:e2e
